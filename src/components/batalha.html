<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="arena.css">
</head>
<body class="arena">
  <main class="palco">
    <h1 class="so-leitor">Arena</h1>

    <header class="topo">
      <div class="ids">
        <span class="tag-jogador tag-voce">Você: <strong id="idVoce">—</strong></span>
        <span class="sep-vs" aria-hidden="true">×</span>
        <span class="tag-jogador tag-adv">Adversário: <strong id="idAdv">…</strong></span>
      </div>
      <div class="marcador">
        <span id="rodada">Rodada —</span>
        <strong id="placar">0 × 0</strong>
      </div>
      <div class="acoes">
        <button class="secundario" id="pedirDica" type="button" disabled>Pedir dica</button>
        <a id="nova" class="botao" href="index.html" hidden>Nova batalha</a>
      </div>
    </header>

    <div class="faixa">
      <p class="msg" id="status" role="status" aria-live="polite">Conectando à batalha…</p>
      <p class="msg dica" id="dica" aria-live="polite"></p>
    </div>

    <section class="zona-mao zona-adv" aria-label="Cartas do adversário">
      <div class="rotulo-zona">
        <span class="tag-jogador tag-adv">Adversário</span>
        <span class="nome-zona" id="rotuloMaoAdv">Cartas do adversário</span>
      </div>
      <div class="mao mao-adv" id="maoAdv"></div>
    </section>

    <section class="campo" aria-label="Campo">
      <div class="painel" id="painel" hidden>
        <h2 id="painelTitulo">Movimentos</h2>
        <div class="golpes" id="golpes"></div>
        <p class="msg" id="jogada" role="status" aria-live="polite"></p>
        <button class="secundario" id="devolver" type="button">Devolver à mão</button>
      </div>
      <div class="lado-campo lado-voce">
        <span class="rotulo-campo tag-voce" id="rotuloCampoVoce">Sua carta em campo</span>
        <div class="slot-campo slot-voce-campo" id="slotCarta" data-vazio="Clique em uma das suas cartas"></div>
      </div>
      <div class="lado-campo lado-adv">
        <span class="rotulo-campo tag-adv" id="rotuloCampoAdv">Carta do adversário</span>
        <div class="slot-campo slot-adv-campo" id="slotAdv" data-vazio="O adversário ainda não jogou"></div>
      </div>
    </section>

    <section class="zona-mao zona-voce" id="zonaVoce" aria-label="Suas cartas">
      <div class="rotulo-zona">
        <span class="tag-jogador tag-voce">Você</span>
        <span class="nome-zona" id="rotuloMaoVoce">Suas cartas</span>
        <span class="dica-turno" id="dicaTurno"></span>
      </div>
      <div class="mao mao-voce" id="maoVoce"></div>
    </section>

    <details class="historico" id="historico" hidden>
      <summary>Rodadas</summary>
      <ol id="listaRodadas"></ol>
    </details>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    const $ = (seletor) => document.querySelector(seletor);
    const params = new URLSearchParams(location.search);
    const idPartida = params.get("partida");
    const idJogador = params.get("jogador");
    if (!idPartida || !idJogador) location.replace("index.html");

    $("#idVoce").textContent = idJogador;
    $("#rotuloMaoVoce").textContent = `${idJogador} · suas cartas`;
    $("#rotuloCampoVoce").textContent = `Sua carta (${idJogador})`;
    $("#nova").href = `index.html?jogador=${encodeURIComponent(idJogador)}`;

    const TIPOS = {
      normal: ["Normal", "#a8a77a"], fire: ["Fogo", "#ee8130"], water: ["Água", "#6390f0"],
      electric: ["Elétrico", "#f7d02c"], grass: ["Planta", "#7ac74c"], ice: ["Gelo", "#96d9d6"],
      fighting: ["Lutador", "#c22e28"], poison: ["Veneno", "#a33ea1"], ground: ["Terra", "#e2bf65"],
      flying: ["Voador", "#a98ff3"], psychic: ["Psíquico", "#f95587"], bug: ["Inseto", "#a6b91a"],
      rock: ["Pedra", "#b6a136"], ghost: ["Fantasma", "#735797"], dragon: ["Dragão", "#6f35fc"],
      dark: ["Sombrio", "#705746"], steel: ["Aço", "#b7b7ce"], fairy: ["Fada", "#d685ad"],
    };
    const nomeTipo = (t) => TIPOS[t]?.[0] ?? t;
    const corTipo = (t) => TIPOS[t]?.[1] ?? "#999999";
    const bonito = (texto) => String(texto).replace(/-/g, " ").replace(/^./, (c) => c.toUpperCase());

    // Estado vindo do backend (GET /batalhas/{id}?jogador=...) e o que o jogador está montando na tela.
    let estado = null;
    let escolhida = null;   // { carta, vaga, c } carta clicada, ainda não enviada
    let enviando = false;

    // ---- Cartas ----------------------------------------------------------
    // c = { id, pokemon: { id, nome, tipos, velocidade, sprite, movimentos } } (formato do backend)
    function criarCarta(c, clicavel) {
      const p = c.pokemon;
      const carta = document.createElement(clicavel ? "button" : "div");
      carta.className = clicavel ? "carta minha" : "carta";
      if (clicavel) carta.type = "button";
      carta.dataset.id = c.id;
      carta.style.setProperty("--tipo", corTipo(p.tipos[0]));
      carta.innerHTML = `
        <span class="topo-carta"><span>${bonito(p.nome)}</span><span class="num">#${p.id}</span></span>
        <img src="${p.sprite ?? ""}" alt="${bonito(p.nome)}">
        <span class="tipos">${p.tipos.map((t) => `<span class="tipo" style="--tipo:${corTipo(t)}">${nomeTipo(t)}</span>`).join("")}</span>
        <span class="vel">Velocidade ${p.velocidade}</span>`;
      return carta;
    }

    function desenharMao(container, cartas, clicavel) {
      container.replaceChildren();
      for (const c of cartas) {
        const vaga = document.createElement("div");
        vaga.className = "vaga";
        const carta = criarCarta(c, clicavel);
        vaga.append(carta);
        container.append(vaga);
        if (clicavel) carta.addEventListener("click", () => clicarNaCarta(carta, vaga, c));
      }
    }

    // Move a carta para outro lugar com uma animação do ponto antigo ao novo.
    function mover(carta, destino, animar = true) {
      const antes = carta.getBoundingClientRect();
      destino.append(carta);
      if (!animar || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const depois = carta.getBoundingClientRect();
      carta.animate(
        [{ transform: `translate(${antes.left - depois.left}px, ${antes.top - depois.top}px)` }, { transform: "none" }],
        { duration: 380, easing: "cubic-bezier(.2,.8,.2,1)" }
      );
    }

    // ---- Escolha de carta e movimento -----------------------------------
    function clicarNaCarta(carta, vaga, c, animar = true) {
      if (!estado?.suaVez || estado.voce.cartaEmCampo) return;
      if (escolhida?.carta === carta) return devolver();
      devolver();
      mover(carta, $("#slotCarta"), animar);
      escolhida = { carta, vaga, c };
      mostrarGolpes(c, true);
    }

    function devolver() {
      if (!escolhida) return;
      mover(escolhida.carta, escolhida.vaga);
      escolhida = null;
      $("#painel").hidden = true;
    }
    $("#devolver").addEventListener("click", devolver);

    function mostrarGolpes(c, podeDevolver) {
      $("#painel").hidden = false;
      $("#devolver").hidden = !podeDevolver;
      $("#painelTitulo").textContent = `Movimentos de ${bonito(c.pokemon.nome)}`;
      $("#jogada").textContent = "";
      $("#golpes").replaceChildren();
      for (const g of c.pokemon.movimentos) {
        const botao = document.createElement("button");
        botao.type = "button";
        botao.className = "golpe";
        botao.style.setProperty("--tipo", corTipo(g.tipo));
        botao.setAttribute("aria-pressed", "false");
        botao.innerHTML = `<span>${bonito(g.nome)}</span><span class="info">${nomeTipo(g.tipo)}, dano ${g.danoBase ?? 50}</span>`;
        botao.addEventListener("click", () => escolherGolpe(botao, c, g));
        $("#golpes").append(botao);
      }
    }

    // Envia a jogada para o S03_Batalha: POST /batalhas/{idPartida}/jogadas
    async function escolherGolpe(botao, c, golpe) {
      if (enviando) return;
      enviando = true;
      $("#golpes").querySelectorAll(".golpe").forEach((b) => {
        b.setAttribute("aria-pressed", String(b === botao));
        b.disabled = true;
      });
      $("#jogada").textContent = `Enviando ${bonito(golpe.nome)}…`;
      try {
        const r = await chamarBatalha(
          `/batalhas/${encodeURIComponent(idPartida)}/jogadas`,
          postJson({ idJogador, idCarta: c.id, nomeMovimento: golpe.nome })
        );
        if (!r.ok) throw new Error(r.corpo?.erro || r.corpo?.detail || "A batalha recusou a jogada.");
        escolhida = null;
        desenhar(r.corpo.estado, true);
      } catch (erro) {
        $("#jogada").textContent = erro.message;
        $("#golpes").querySelectorAll(".golpe").forEach((b) => { b.disabled = false; });
      } finally {
        enviando = false;
      }
    }

    // ---- Dica (Recomendação de Cartas ou dica local) ---------------------
    $("#pedirDica").addEventListener("click", async () => {
      $("#pedirDica").disabled = true;
      $("#dica").textContent = "Pensando…";
      try {
        const r = await chamarBatalha(`/batalhas/${encodeURIComponent(idPartida)}/dica`, postJson({ idJogador }));
        $("#dica").textContent = r.ok ? `Dica: ${r.corpo.dica}` : (r.corpo?.erro || "Dica indisponível.");
      } catch (erro) {
        $("#dica").textContent = erro.message;
      } finally {
        $("#pedirDica").disabled = !estado?.suaVez;
      }
    });

    // ---- Desenho do estado ----------------------------------------------
    function textoRodada(r) {
      const [a, b] = r.jogadas;
      const chance = Math.round(r.probabilidadeJogador1 * 100);
      return `Rodada ${r.rodada}: ${bonito(a.pokemon)} (${bonito(a.movimento)}, força ${a.forca}) × ` +
        `${bonito(b.pokemon)} (${bonito(b.movimento)}, força ${b.forca}). ` +
        `Chance de ${a.idJogador}: ${chance}%, sorteio ${r.sorteio.toFixed(2)}. Venceu ${r.idVencedor}.`;
    }

    function mensagem(e) {
      const adv = e.adversario.idJogador;
      if (e.status === "FINALIZADA") {
        const venceu = e.idVencedor === idJogador;
        return `${venceu ? "Você venceu" : "Você perdeu"}: ${e.voce.pontos} × ${e.adversario.pontos}. ${e.detalhes}`;
      }
      if (e.suaVez && e.voce.cartaEmCampo) return "Seu Pokémon venceu e continua em campo. Escolha o movimento.";
      if (e.suaVez) {
        const primeiro = e.primeiroDaRodada === idJogador;
        return primeiro ? "Sua vez: você escolhe primeiro nesta rodada." : `${adv} já escolheu. Sua vez.`;
      }
      if (e.voce.jaJogou) return `Jogada enviada. Aguardando ${adv}.`;
      return `${adv} escolhe primeiro nesta rodada. Aguarde.`;
    }

    function desenhar(e, forcar = false) {
      if (!forcar && estado && estado.versao === e.versao && estado.status === e.status) return;
      const anterior = estado;
      estado = e;

      const adv = e.idJogador1 === idJogador ? e.idJogador2 : e.idJogador1;
      $("#idAdv").textContent = adv;
      $("#rotuloCampoAdv").textContent = `Adversário (${adv})`;
      $("#rodada").textContent = e.terminou ? "Fim" : `Rodada ${e.turno} de 5`;
      $("#placar").textContent = `${e.placar[idJogador] ?? 0} × ${e.placar[adv] ?? 0}`;

      if (e.status === "PREPARANDO") {
        $("#status").textContent = "Buscando as cartas dos jogadores…";
        return;
      }
      if (e.status === "ERRO") {
        $("#status").textContent = e.erro || "A batalha falhou.";
        $("#status").className = "msg erro";
        $("#nova").hidden = false;
        return;
      }

      const v = e.voce;
      const podeEscolherCarta = e.suaVez && !v.cartaEmCampo;
      const idSelecionada = escolhida?.c.id;
      escolhida = null;
      $("#painel").hidden = true;

      const qtdAdv = e.adversario.mao.length;
      const qtdVoce = v.mao.length;
      $("#rotuloMaoAdv").textContent = `${adv} · ${qtdAdv} ${qtdAdv === 1 ? "carta na mão" : "cartas na mão"}`;
      $("#rotuloMaoVoce").textContent = `${idJogador} · ${qtdVoce} ${qtdVoce === 1 ? "carta na mão" : "cartas na mão"}`;
      $("#zonaVoce").classList.toggle("sua-vez", Boolean(e.suaVez && !e.terminou));
      $("#dicaTurno").textContent = e.terminou
        ? "Partida encerrada"
        : e.suaVez
          ? (v.cartaEmCampo ? "Sua vez — escolha um golpe no campo" : "Sua vez — clique em uma carta")
          : `Aguardando ${adv}…`;

      desenharMao($("#maoAdv"), e.adversario.mao, false);
      desenharMao($("#maoVoce"), v.mao, podeEscolherCarta);
      $("#maoVoce").classList.toggle("travada", !podeEscolherCarta);

      // Campo do jogador: Pokémon que ficou em campo, ou a carta já enviada nesta rodada.
      $("#slotCarta").replaceChildren();
      const pendente = v.jogadaPendente;
      const cartaPendente = pendente && !v.cartaEmCampo ? v.mao.find((c) => c.id === pendente.idCarta) : null;
      if (v.cartaEmCampo) {
        $("#slotCarta").append(criarCarta(v.cartaEmCampo, false));
        if (e.suaVez) mostrarGolpes(v.cartaEmCampo, false);
      } else if (cartaPendente) {
        $("#maoVoce").querySelector(`[data-id="${CSS.escape(cartaPendente.id)}"]`)?.closest(".vaga")?.replaceChildren();
        $("#slotCarta").append(criarCarta(cartaPendente, false));
      }
      $("#slotCarta").dataset.vazio = e.suaVez && !e.terminou ? "Clique em uma das suas cartas" : "";

      // Campo do adversário.
      $("#slotAdv").replaceChildren();
      if (e.adversario.cartaEmCampo) $("#slotAdv").append(criarCarta(e.adversario.cartaEmCampo, false));
      $("#slotAdv").dataset.vazio = e.terminou ? "" :
        e.adversario.jaJogou ? "O adversário já escolheu" : "O adversário ainda não jogou";

      // Se o jogador estava com uma carta escolhida (e o adversário só fez a parte dele), mantém a escolha.
      if (podeEscolherCarta && idSelecionada) {
        const botao = $("#maoVoce").querySelector(`[data-id="${CSS.escape(idSelecionada)}"]`);
        const c = v.mao.find((x) => x.id === idSelecionada);
        if (botao && c) clicarNaCarta(botao, botao.closest(".vaga"), c, false);
      }

      // Mensagens, histórico e fim de jogo.
      $("#status").className = "msg";
      const ultima = e.rodadas.at(-1);
      const novaRodada = ultima && (!anterior || anterior.rodadas.length < e.rodadas.length);
      $("#status").textContent = (novaRodada ? textoRodada(ultima) + " " : "") + mensagem(e);
      $("#listaRodadas").replaceChildren(...e.rodadas.map((r) => {
        const li = document.createElement("li");
        li.textContent = textoRodada(r);
        return li;
      }));
      $("#historico").hidden = e.rodadas.length === 0;
      $("#pedirDica").disabled = !e.suaVez;
      if (!e.suaVez) $("#dica").textContent = "";
      $("#nova").hidden = !e.terminou;
    }

    // ---- Acompanhamento (consulta o backend a cada INTERVALO_MS) ---------
    async function acompanhar() {
      const inicio = Date.now();
      while (true) {
        try {
          const r = await chamarBatalha(
            `/batalhas/${encodeURIComponent(idPartida)}?jogador=${encodeURIComponent(idJogador)}`
          );
          if (r.status === 404) {
            const s = Math.round((Date.now() - inicio) / 1000);
            $("#status").textContent = `Aguardando o gerenciador enviar a partida para a batalha… (${s} s)` +
              (s > 10 ? " Se o gerenciador estiver com USE_MOCK_BATALHA=true, ele não chama este serviço." : "");
          } else if (r.ok) {
            if (!enviando) desenhar(r.corpo);
            if (r.corpo.terminou || r.corpo.status === "ERRO") return;
          } else {
            $("#status").textContent = r.corpo?.erro || "Erro ao consultar a batalha.";
          }
        } catch (erro) {
          $("#status").textContent = erro.message;
        }
        await esperar(INTERVALO_MS);
      }
    }

    if (idPartida && idJogador) acompanhar();
  </script>
</body>
</html>
